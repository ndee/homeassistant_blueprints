blueprint:
  name: Auto Light (Occupancy + Optional Brightness) with Manual Switch Support v3
  description: >
    Automatically turns lights on/off based on occupancy and, when configured, indoor brightness.
    Uses hysteresis (different on/off thresholds) to prevent flickering.
    Configurable off-delay prevents lights from turning off immediately when motion stops.
    Extended with support for connected switches: auto-on after delay when switch turns off lights, and different auto-off delay when turned on via switch.
    Robust Auto OFF tracks both occupancy and the actual controlled light entities, including when Lights is configured via an area, device, or label.
    If an Indoor Lux Sensor is configured, high-lux Auto OFF is also active; with no sensor configured, all lux-related paths are ignored.
    A lightweight 30-second safety reconciliation covers Home Assistant/automation reloads when OFF conditions were already true.
  domain: automation
  input:
    occupancy_sensor:
      name: Occupancy Sensor
      description: Binary sensor that detects presence/motion (e.g., binary_sensor.detection_area_studio_occupancy_status)
      selector:
        entity:
          domain: binary_sensor

    lights:
      name: Lights
      description: The lights to control (supports entities, devices, areas, or labels)
      selector:
        target:
          entity:
            domain: light

    connected_switches:
      name: Connected Switches (optional)
      description: Switches or sensors that manually control the lights. Use entities that change to 'on' for turn on, 'off' for turn off.
      default: []
      selector:
        entity:
          multiple: true

    auto_on_enabled:
      name: Enable Auto ON
      description: Automatically turn lights on when occupancy is detected and, if an Indoor Lux Sensor is configured, brightness is low
      default: true
      selector:
        boolean:

    auto_off_enabled:
      name: Enable Auto OFF
      description: Automatically turn lights off when no occupancy or, if an Indoor Lux Sensor is configured, brightness is high
      default: true
      selector:
        boolean:

    sleep_mode_entity:
      name: Sleep Mode (optional)
      description: >
        Optional input_boolean helper(s) for sleep mode. When any selected helper is ON,
        lights will only turn OFF automatically, never ON. When activated, lights turn off
        after the configured delay. Leave empty to disable sleep-mode handling.
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true

    sleep_mode_off_delay:
      name: Sleep Mode Turn OFF Delay (Seconds)
      description: When sleep mode is activated, wait this many seconds before turning off the lights (0 = immediate)
      default: 0
      selector:
        number:
          min: 0
          max: 300
          step: 5
          unit_of_measurement: seconds
          mode: slider

    alarm_panel:
      name: Alarm Panel (optional)
      description: >
        Alarmo alarm control panel for presence mode.
        When disarmed or armed_home/armed_night (someone is home), lights can turn on automatically.
        When armed_away or armed_vacation (away), lights only turn OFF, never ON.
      default: null
      selector:
        entity:
          domain: alarm_control_panel

    lux_sensor:
      name: Indoor Lux Sensor (optional)
      description: >
        Optional sensor measuring indoor illuminance in lux.
        If not configured, all lux-based logic is ignored and the lux threshold settings below have no effect.
        Auto-on then uses occupancy/presence conditions without a brightness check.
      default: ""
      selector:
        entity:
          domain: sensor

    lux_threshold_on:
      name: Turn ON Below (lux)
      description: >
        Turn on lights when brightness is below this value.
        Requires an Indoor Lux Sensor; ignored when no Indoor Lux Sensor is configured.
      default: 50
      selector:
        number:
          min: 0
          max: 1000
          step: 5
          unit_of_measurement: lx
          mode: slider

    lux_threshold_off:
      name: Turn OFF Above (lux)
      description: >
        Turn off lights when brightness exceeds this value (should be higher than ON threshold to prevent flickering).
        Requires an Indoor Lux Sensor; ignored when no Indoor Lux Sensor is configured.
      default: 100
      selector:
        number:
          min: 0
          max: 1000
          step: 5
          unit_of_measurement: lx
          mode: slider

    off_delay:
      name: Turn OFF Delay (Auto)
      description: Wait this many seconds while occupancy is OFF and a controlled light is ON before Auto OFF (0 = immediate)
      default: 0
      selector:
        number:
          min: 0
          max: 900
          step: 30
          unit_of_measurement: seconds
          mode: slider

    manual_off_delay:
      name: Turn OFF Delay (Manual)
      description: Wait this many seconds while occupancy is OFF and a controlled light is ON when manual mode was activated via a connected switch
      default: 300
      selector:
        number:
          min: 0
          max: 3600
          step: 30
          unit_of_measurement: seconds
          mode: slider

    auto_on_after_manual_off_delay:
      name: Auto ON Delay after Switch OFF
      description: Delay before automatically turning on after switch turns off the lights
      default: 5
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: slider

    adaptive_lighting_switch:
      name: Adaptive Lighting Switch (optional)
      description: >
        The main enable/disable switch for Adaptive Lighting integration
        (e.g., switch.adaptive_lighting_living_room).
        Will be turned on and applied when lights turn on.
      default: null
      selector:
        entity:
          domain: switch

    adaptive_lighting_sleep_mode_switch:
      name: Adaptive Lighting Sleep Mode Switch (optional)
      description: >
        The sleep mode switch for Adaptive Lighting integration
        (e.g., switch.adaptive_lighting_sleep_mode_living_room).
        Will sync with the configured Sleep Mode helper state.
      default: null
      selector:
        entity:
          domain: switch

    adaptive_lighting_apply_delay:
      name: Adaptive Lighting Apply Delay (Seconds)
      description: Delay before applying adaptive lighting after lights turn on. Prevents race conditions with slow-responding lights.
      default: 0.5
      selector:
        number:
          min: 0
          max: 5
          step: 0.1
          unit_of_measurement: seconds
          mode: slider

    adaptive_lighting_transition:
      name: Adaptive Lighting Transition Time (Seconds)
      description: Transition time for applying adaptive lighting. 0 = instant change.
      default: 0
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: seconds
          mode: slider

    adaptive_lighting_prefer_rgb:
      name: Adaptive Lighting Prefer RGB Color
      description: Whether to prefer RGB color adjustment over color temperature when possible.
      default: false
      selector:
        boolean:

    wall_switch_events:
      name: Wall Switch Event Entities (optional)
      description: >
        Event entities for wall switches that support press events
        (e.g., event.hue_wall_switch_module_6_taste_1).
        Triple-toggle detection will work with these.
      default: []
      selector:
        entity:
          domain: event
          multiple: true

    triple_toggle_time_window:
      name: Triple Toggle Time Window (Seconds)
      description: >
        Time window in seconds for detecting triple toggle.
        If the switch is toggled 3 times within this window, adaptive lighting is disabled
        and lights turn on at full brightness with cold white.
      default: 2
      selector:
        number:
          min: 1
          max: 5
          step: 0.5
          unit_of_measurement: seconds
          mode: slider

    state_helper:
      name: State Helper (optional)
      description: >
        An input_text helper to store all automation state as JSON
        (e.g., input_text.auto_light_state).
        Used for: manual mode tracking, triple-toggle detection.
        Required if using connected switches or wall switch events.
      default: null
      selector:
        entity:
          domain: input_text

    full_brightness_color_temp:
      name: Full Brightness Color Temperature (Kelvin)
      description: Color temperature to use when triple-toggle activates full brightness mode.
      default: 6500
      selector:
        number:
          min: 2700
          max: 6500
          step: 100
          unit_of_measurement: K
          mode: slider


trigger_variables:
  occupancy_sensor_trigger: !input occupancy_sensor
  lights_target_trigger: !input lights
  state_helper_trigger: !input state_helper
  lux_sensor_trigger: !input lux_sensor
  lux_off_trigger: !input lux_threshold_off

variables:
  auto_on_enabled: !input auto_on_enabled
  auto_off_enabled: !input auto_off_enabled
  sleep_mode_entities: !input sleep_mode_entity
  sleep_mode_off_delay: !input sleep_mode_off_delay
  alarm_panel: !input alarm_panel
  lux_sensor: !input lux_sensor
  lux_on: !input lux_threshold_on
  lux_off: !input lux_threshold_off
  off_delay: !input off_delay
  manual_off_delay: !input manual_off_delay
  auto_on_after_manual_off_delay: !input auto_on_after_manual_off_delay
  adaptive_lighting_switch: !input adaptive_lighting_switch
  adaptive_lighting_sleep_mode_switch: !input adaptive_lighting_sleep_mode_switch
  adaptive_lighting_apply_delay: !input adaptive_lighting_apply_delay
  adaptive_lighting_transition: !input adaptive_lighting_transition
  adaptive_lighting_prefer_rgb: !input adaptive_lighting_prefer_rgb
  has_adaptive_lighting: "{{ adaptive_lighting_switch not in [none, '', 'null'] }}"
  has_adaptive_lighting_sleep: "{{ adaptive_lighting_sleep_mode_switch not in [none, '', 'null'] }}"
  lights_target: !input lights

  # Resolve the target selector to actual light entity IDs.
  # This is important when "Lights" is configured with an area, device, or label
  # instead of explicit light entities.
  controlled_light_entities: >
    {% set ns = namespace(entities=[]) %}
    {% if lights_target is string %}
      {% if lights_target.startswith('light.') %}
        {% set ns.entities = ns.entities + [lights_target] %}
      {% endif %}
    {% elif lights_target is mapping %}
      {% set direct_entities = lights_target.get('entity_id', []) %}
      {% if direct_entities is string %}
        {% set direct_entities = [direct_entities] %}
      {% endif %}
      {% for entity_id in direct_entities %}
        {% if entity_id.startswith('light.') %}
          {% set ns.entities = ns.entities + [entity_id] %}
        {% endif %}
      {% endfor %}

      {% set device_ids = lights_target.get('device_id', []) %}
      {% if device_ids is string %}
        {% set device_ids = [device_ids] %}
      {% endif %}
      {% for device_id in device_ids %}
        {% for entity_id in device_entities(device_id) %}
          {% if entity_id.startswith('light.') %}
            {% set ns.entities = ns.entities + [entity_id] %}
          {% endif %}
        {% endfor %}
      {% endfor %}

      {% set area_ids = lights_target.get('area_id', []) %}
      {% if area_ids is string %}
        {% set area_ids = [area_ids] %}
      {% endif %}
      {% for area_id in area_ids %}
        {% for entity_id in area_entities(area_id) %}
          {% if entity_id.startswith('light.') %}
            {% set ns.entities = ns.entities + [entity_id] %}
          {% endif %}
        {% endfor %}
      {% endfor %}

      {% set label_ids = lights_target.get('label_id', []) %}
      {% if label_ids is string %}
        {% set label_ids = [label_ids] %}
      {% endif %}
      {% for label_id in label_ids %}
        {# Entities directly carrying the label #}
        {% for entity_id in label_entities(label_id) %}
          {% if entity_id.startswith('light.') %}
            {% set ns.entities = ns.entities + [entity_id] %}
          {% endif %}
        {% endfor %}

        {# Devices carrying the label #}
        {% for device_id in label_devices(label_id) %}
          {% for entity_id in device_entities(device_id) %}
            {% if entity_id.startswith('light.') %}
              {% set ns.entities = ns.entities + [entity_id] %}
            {% endif %}
          {% endfor %}
        {% endfor %}

        {# Areas carrying the label #}
        {% for area_id in label_areas(label_id) %}
          {% for entity_id in area_entities(area_id) %}
            {% if entity_id.startswith('light.') %}
              {% set ns.entities = ns.entities + [entity_id] %}
            {% endif %}
          {% endfor %}
        {% endfor %}
      {% endfor %}
    {% endif %}
    {{ ns.entities | unique | list }}

  state_helper: !input state_helper
  triple_toggle_time_window: !input triple_toggle_time_window
  full_brightness_color_temp: !input full_brightness_color_temp
  has_state_helper: "{{ state_helper not in [none, '', 'null'] }}"
  has_lux_sensor: "{{ lux_sensor not in [none, '', 'null'] }}"
  occupancy_sensor_entity: !input occupancy_sensor

  # Check if sleep mode is active
  sleep_mode_active: >
    {{ sleep_mode_entities | count > 0
       and (expand(sleep_mode_entities) | selectattr('state', 'eq', 'on') | list | count > 0) }}

  # Check if presence mode allows auto-on based on alarm panel state
  # Allow auto-on when: not configured, disarmed, armed_home, or armed_night (someone is home)
  # Prevent auto-on when: armed_away or armed_vacation (nobody home)
  presence_allows_on: >
    {{ alarm_panel in [none, '', 'null'] or states(alarm_panel) in ['disarmed', 'armed_home', 'armed_night'] }}

  # Lux checks are active only when an Indoor Lux Sensor is configured.
  # With no sensor, lux-based logic is bypassed completely.
  brightness_is_low: >
    {% if has_lux_sensor %}
      {{ states(lux_sensor) | float(1000) < lux_on }}
    {% else %}
      true
    {% endif %}

  brightness_is_high: >
    {% if has_lux_sensor %}
      {{ states(lux_sensor) | float(0) > lux_off }}
    {% else %}
      false
    {% endif %}

# Note: We use mode: queued to handle race conditions properly
# This allows delays to complete without being cancelled by new triggers
trigger:
  # Trigger when occupancy is detected for Auto ON.
  - platform: state
    entity_id: !input occupancy_sensor
    from: "off"
    to: "on"
    id: motion_detected

  # Robust Auto OFF (automatic mode):
  # Starts timing as soon as BOTH conditions are true:
  #   1) occupancy is off
  #   2) at least one controlled light is on
  # This also works if the light is switched on while occupancy is already off.
  - platform: template
    id: auto_off_no_occupancy
    value_template: >
      {% set ns = namespace(entities=[]) %}
      {% if lights_target_trigger is string %}
        {% if lights_target_trigger.startswith('light.') %}
          {% set ns.entities = ns.entities + [lights_target_trigger] %}
        {% endif %}
      {% elif lights_target_trigger is mapping %}
        {% set direct_entities = lights_target_trigger.get('entity_id', []) %}
        {% if direct_entities is string %}{% set direct_entities = [direct_entities] %}{% endif %}
        {% for entity_id in direct_entities %}
          {% if entity_id.startswith('light.') %}{% set ns.entities = ns.entities + [entity_id] %}{% endif %}
        {% endfor %}

        {% set device_ids = lights_target_trigger.get('device_id', []) %}
        {% if device_ids is string %}{% set device_ids = [device_ids] %}{% endif %}
        {% for device_id in device_ids %}
          {% for entity_id in device_entities(device_id) %}
            {% if entity_id.startswith('light.') %}{% set ns.entities = ns.entities + [entity_id] %}{% endif %}
          {% endfor %}
        {% endfor %}

        {% set area_ids = lights_target_trigger.get('area_id', []) %}
        {% if area_ids is string %}{% set area_ids = [area_ids] %}{% endif %}
        {% for area_id in area_ids %}
          {% for entity_id in area_entities(area_id) %}
            {% if entity_id.startswith('light.') %}{% set ns.entities = ns.entities + [entity_id] %}{% endif %}
          {% endfor %}
        {% endfor %}

        {% set label_ids = lights_target_trigger.get('label_id', []) %}
        {% if label_ids is string %}{% set label_ids = [label_ids] %}{% endif %}
        {% for label_id in label_ids %}
          {% for entity_id in label_entities(label_id) %}
            {% if entity_id.startswith('light.') %}{% set ns.entities = ns.entities + [entity_id] %}{% endif %}
          {% endfor %}
          {% for device_id in label_devices(label_id) %}
            {% for entity_id in device_entities(device_id) %}
              {% if entity_id.startswith('light.') %}{% set ns.entities = ns.entities + [entity_id] %}{% endif %}
            {% endfor %}
          {% endfor %}
          {% for area_id in label_areas(label_id) %}
            {% for entity_id in area_entities(area_id) %}
              {% if entity_id.startswith('light.') %}{% set ns.entities = ns.entities + [entity_id] %}{% endif %}
            {% endfor %}
          {% endfor %}
        {% endfor %}
      {% endif %}

      {% set helper = namespace(manual=false, boost=false) %}
      {% if state_helper_trigger not in [none, '', 'null'] %}
        {% set raw = states(state_helper_trigger) %}
        {% if raw and raw not in ['unknown', 'unavailable', ''] %}
          {% set stored = raw | from_json %}
          {% set helper.manual = stored.get('manual_mode', false) %}
          {% set helper.boost = stored.get('brightness_boost', false) %}
        {% endif %}
      {% endif %}

      {{ is_state(occupancy_sensor_trigger, 'off')
         and not helper.manual
         and not helper.boost
         and (expand(ns.entities | unique | list)
              | selectattr('state', 'eq', 'on')
              | list | count > 0) }}
    for:
      seconds: !input off_delay

  # Robust Auto OFF (manual mode).
  # Uses the separate manual delay when the connected switch has set manual_mode.
  - platform: template
    id: manual_off_no_occupancy
    value_template: >
      {% set ns = namespace(entities=[]) %}
      {% if lights_target_trigger is string %}
        {% if lights_target_trigger.startswith('light.') %}
          {% set ns.entities = ns.entities + [lights_target_trigger] %}
        {% endif %}
      {% elif lights_target_trigger is mapping %}
        {% set direct_entities = lights_target_trigger.get('entity_id', []) %}
        {% if direct_entities is string %}{% set direct_entities = [direct_entities] %}{% endif %}
        {% for entity_id in direct_entities %}
          {% if entity_id.startswith('light.') %}{% set ns.entities = ns.entities + [entity_id] %}{% endif %}
        {% endfor %}

        {% set device_ids = lights_target_trigger.get('device_id', []) %}
        {% if device_ids is string %}{% set device_ids = [device_ids] %}{% endif %}
        {% for device_id in device_ids %}
          {% for entity_id in device_entities(device_id) %}
            {% if entity_id.startswith('light.') %}{% set ns.entities = ns.entities + [entity_id] %}{% endif %}
          {% endfor %}
        {% endfor %}

        {% set area_ids = lights_target_trigger.get('area_id', []) %}
        {% if area_ids is string %}{% set area_ids = [area_ids] %}{% endif %}
        {% for area_id in area_ids %}
          {% for entity_id in area_entities(area_id) %}
            {% if entity_id.startswith('light.') %}{% set ns.entities = ns.entities + [entity_id] %}{% endif %}
          {% endfor %}
        {% endfor %}

        {% set label_ids = lights_target_trigger.get('label_id', []) %}
        {% if label_ids is string %}{% set label_ids = [label_ids] %}{% endif %}
        {% for label_id in label_ids %}
          {% for entity_id in label_entities(label_id) %}
            {% if entity_id.startswith('light.') %}{% set ns.entities = ns.entities + [entity_id] %}{% endif %}
          {% endfor %}
          {% for device_id in label_devices(label_id) %}
            {% for entity_id in device_entities(device_id) %}
              {% if entity_id.startswith('light.') %}{% set ns.entities = ns.entities + [entity_id] %}{% endif %}
            {% endfor %}
          {% endfor %}
          {% for area_id in label_areas(label_id) %}
            {% for entity_id in area_entities(area_id) %}
              {% if entity_id.startswith('light.') %}{% set ns.entities = ns.entities + [entity_id] %}{% endif %}
            {% endfor %}
          {% endfor %}
        {% endfor %}
      {% endif %}

      {% set helper = namespace(manual=false, boost=false) %}
      {% if state_helper_trigger not in [none, '', 'null'] %}
        {% set raw = states(state_helper_trigger) %}
        {% if raw and raw not in ['unknown', 'unavailable', ''] %}
          {% set stored = raw | from_json %}
          {% set helper.manual = stored.get('manual_mode', false) %}
          {% set helper.boost = stored.get('brightness_boost', false) %}
        {% endif %}
      {% endif %}

      {{ is_state(occupancy_sensor_trigger, 'off')
         and helper.manual
         and not helper.boost
         and (expand(ns.entities | unique | list)
              | selectattr('state', 'eq', 'on')
              | list | count > 0) }}
    for:
      seconds: !input manual_off_delay

  # Optional Lux Auto OFF:
  # This trigger can only become true when an Indoor Lux Sensor is configured.
  # With no lux sensor selected, the entire path remains false/ignored.
  - platform: template
    id: brightness_high
    value_template: >
      {{ lux_sensor_trigger not in [none, '', 'null']
         and states(lux_sensor_trigger) not in ['unknown', 'unavailable', '']
         and (states(lux_sensor_trigger) | float(0)) > (lux_off_trigger | float(0)) }}

  # Safety reconciliation for states that were already true when automations were
  # loaded/reloaded. Normal Auto OFF uses the exact template-trigger timers above;
  # this fallback checks every 30 seconds and after Home Assistant starts.
  - platform: time_pattern
    seconds: "/30"
    id: auto_off_safety_check

  - platform: homeassistant
    event: start
    id: auto_off_safety_check

  # Triggers for connected switches
  - platform: state
    entity_id: !input connected_switches
    to: "on"
    id: switch_turned_on
  - platform: state
    entity_id: !input connected_switches
    to: "off"
    id: switch_turned_off

  # Trigger when sleep mode is activated
  - platform: state
    entity_id: !input sleep_mode_entity
    from: "off"
    to: "on"
    id: sleep_mode_activated

  # Trigger when sleep mode is deactivated
  - platform: state
    entity_id: !input sleep_mode_entity
    from: "on"
    to: "off"
    id: sleep_mode_deactivated

  # Trigger for wall switch events (for triple-toggle detection)
  - platform: state
    entity_id: !input wall_switch_events
    id: wall_switch_event

action:
  - choose:
      # Turn ON: auto-on enabled AND occupancy detected AND brightness is low AND NOT sleeping AND present
      - conditions:
          - condition: trigger
            id:
              - motion_detected
          - condition: template
            value_template: "{{ auto_on_enabled }}"
          - condition: template
            value_template: "{{ not sleep_mode_active }}"
          - condition: template
            value_template: "{{ presence_allows_on }}"
          - condition: template
            value_template: "{{ brightness_is_low }}"
        sequence:
          # Re-read state helper to get fresh values
          - variables:
              current_state: >
                {% if has_state_helper %}
                  {% set raw = states(state_helper) %}
                  {% if raw and raw not in ['unknown', 'unavailable', ''] %}
                    {{ raw | from_json }}
                  {% else %}
                    {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                  {% endif %}
                {% else %}
                  {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                {% endif %}
          # Reset manual mode and brightness_boost if active (on auto turn-on)
          - if:
              - condition: template
                value_template: "{{ has_state_helper and (current_state.get('manual_mode', false) or current_state.get('brightness_boost', false)) }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: "{{ state_helper }}"
                data:
                  value: >
                    {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': current_state.get('toggle_count', 0), 'last_toggle': current_state.get('last_toggle', 0)} | to_json }}
          # Only turn on if at least one resolved controlled light is off.
          # If target resolution yields no entities, let Home Assistant resolve the target itself.
          - condition: template
            value_template: >
              {{ controlled_light_entities | count == 0
                 or (expand(controlled_light_entities)
                     | selectattr('state', 'eq', 'off')
                     | list | count > 0) }}
          - service: light.turn_on
            target: !input lights
          - if:
              - condition: template
                value_template: "{{ has_adaptive_lighting }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ adaptive_lighting_switch }}"
              - delay:
                  seconds: "{{ adaptive_lighting_apply_delay }}"
              - service: adaptive_lighting.apply
                target:
                  entity_id: "{{ adaptive_lighting_switch }}"
                data:
                  lights: "{{ controlled_light_entities }}"
                  transition: "{{ adaptive_lighting_transition }}"
                  prefer_rgb_color: "{{ adaptive_lighting_prefer_rgb }}"

      # Robust Turn OFF:
      # The template triggers above have already verified that occupancy stayed off
      # for the configured auto/manual delay while at least one controlled light was on.
      - conditions:
          - condition: trigger
            id:
              - auto_off_no_occupancy
              - manual_off_no_occupancy
          - condition: template
            value_template: "{{ auto_off_enabled }}"
          - condition: state
            entity_id: !input occupancy_sensor
            state: "off"
        sequence:
          # Re-read the helper immediately before switching off so a newly activated
          # brightness boost can still cancel the automatic OFF.
          - variables:
              current_state: >
                {% if has_state_helper %}
                  {% set raw = states(state_helper) %}
                  {% if raw and raw not in ['unknown', 'unavailable', ''] %}
                    {{ raw | from_json }}
                  {% else %}
                    {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                  {% endif %}
                {% else %}
                  {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                {% endif %}
          - condition: template
            value_template: "{{ not current_state.get('brightness_boost', false) }}"

          # Only continue if a controlled light is still on.
          - condition: template
            value_template: >
              {{ controlled_light_entities | count == 0
                 or (expand(controlled_light_entities)
                     | selectattr('state', 'eq', 'on')
                     | list | count > 0) }}

          # Reset manual mode after the manual auto-off has completed.
          - if:
              - condition: template
                value_template: "{{ has_state_helper and current_state.get('manual_mode', false) }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: "{{ state_helper }}"
                data:
                  value: >
                    {{ {
                      'manual_mode': false,
                      'brightness_boost': current_state.get('brightness_boost', false),
                      'toggle_count': current_state.get('toggle_count', 0),
                      'last_toggle': current_state.get('last_toggle', 0)
                    } | to_json }}

          - service: light.turn_off
            target: !input lights

      # Turn OFF when the optional Indoor Lux Sensor rises above the OFF threshold.
      # This path is impossible when no lux sensor is configured.
      - conditions:
          - condition: trigger
            id: brightness_high
          - condition: template
            value_template: "{{ auto_off_enabled }}"
        sequence:
          - variables:
              current_state: >
                {% if has_state_helper %}
                  {% set raw = states(state_helper) %}
                  {% if raw and raw not in ['unknown', 'unavailable', ''] %}
                    {{ raw | from_json }}
                  {% else %}
                    {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                  {% endif %}
                {% else %}
                  {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                {% endif %}

          # Brightness boost is an explicit manual override and blocks normal Auto OFF.
          - condition: template
            value_template: "{{ not current_state.get('brightness_boost', false) }}"

          - condition: template
            value_template: >
              {{ controlled_light_entities | count == 0
                 or (expand(controlled_light_entities)
                     | selectattr('state', 'eq', 'on')
                     | list | count > 0) }}

          - if:
              - condition: template
                value_template: "{{ has_state_helper and current_state.get('manual_mode', false) }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: "{{ state_helper }}"
                data:
                  value: >
                    {{ {
                      'manual_mode': false,
                      'brightness_boost': current_state.get('brightness_boost', false),
                      'toggle_count': current_state.get('toggle_count', 0),
                      'last_toggle': current_state.get('last_toggle', 0)
                    } | to_json }}

          - service: light.turn_off
            target: !input lights

      # Fallback Auto OFF reconciliation.
      # Normal operation is handled by the exact template-trigger timers. This
      # catches cases where the automation was loaded/reloaded while occupancy was
      # already OFF and a light was already ON.
      - conditions:
          - condition: trigger
            id: auto_off_safety_check
          - condition: template
            value_template: "{{ auto_off_enabled }}"
          - condition: state
            entity_id: !input occupancy_sensor
            state: "off"
        sequence:
          - variables:
              current_state: >
                {% if has_state_helper %}
                  {% set raw = states(state_helper) %}
                  {% if raw and raw not in ['unknown', 'unavailable', ''] %}
                    {{ raw | from_json }}
                  {% else %}
                    {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                  {% endif %}
                {% else %}
                  {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                {% endif %}
              current_manual_active: "{{ has_state_helper and current_state.get('manual_mode', false) }}"
              current_brightness_boost: "{{ has_state_helper and current_state.get('brightness_boost', false) }}"
              current_off_delay: "{{ manual_off_delay if current_manual_active else off_delay }}"
              occupancy_off_seconds: >
                {% set occ = expand(occupancy_sensor_entity) | first %}
                {% if occ is not none and occ.state == 'off' %}
                  {{ (as_timestamp(now()) - as_timestamp(occ.last_changed)) | float(0) }}
                {% else %}
                  0
                {% endif %}
              newest_light_on_seconds: >
                {% set on_lights = expand(controlled_light_entities)
                   | selectattr('state', 'eq', 'on') | list %}
                {% if on_lights | count == 0 %}
                  0
                {% else %}
                  {% set ns = namespace(min_age=999999999) %}
                  {% for light_state in on_lights %}
                    {% set age = (as_timestamp(now()) - as_timestamp(light_state.last_changed)) | float(0) %}
                    {% if age < ns.min_age %}
                      {% set ns.min_age = age %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.min_age }}
                {% endif %}

          - condition: template
            value_template: "{{ not current_brightness_boost }}"

          # The resolver should always find entities for entity/device/area/label targets.
          # Requiring at least one prevents the fallback from acting on an unresolved target.
          - condition: template
            value_template: >
              {{ controlled_light_entities | count > 0
                 and (expand(controlled_light_entities)
                      | selectattr('state', 'eq', 'on')
                      | list | count > 0) }}

          # Both absence and the currently-on light(s) must have lasted for the configured delay.
          # This prevents a newly manually switched-on light from being shut off immediately just
          # because occupancy had already been OFF for a long time.
          - condition: template
            value_template: >
              {{ (occupancy_off_seconds | float(0)) >= (current_off_delay | float(0))
                 and (newest_light_on_seconds | float(0)) >= (current_off_delay | float(0)) }}

          - if:
              - condition: template
                value_template: "{{ has_state_helper and current_state.get('manual_mode', false) }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: "{{ state_helper }}"
                data:
                  value: >
                    {{ {
                      'manual_mode': false,
                      'brightness_boost': current_state.get('brightness_boost', false),
                      'toggle_count': current_state.get('toggle_count', 0),
                      'last_toggle': current_state.get('last_toggle', 0)
                    } | to_json }}

          - service: light.turn_off
            target: !input lights

      # Handle switch turned on: set manual mode
      - conditions:
          - condition: trigger
            id: switch_turned_on
        sequence:
          - if:
              - condition: template
                value_template: "{{ has_state_helper }}"
            then:
              # Re-read state to get current values
              - variables:
                  current_state: >
                    {% set raw = states(state_helper) %}
                    {% if raw and raw not in ['unknown', 'unavailable', ''] %}
                      {{ raw | from_json }}
                    {% else %}
                      {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                    {% endif %}
              - service: input_text.set_value
                target:
                  entity_id: "{{ state_helper }}"
                data:
                  value: >
                    {{ {'manual_mode': true, 'brightness_boost': current_state.get('brightness_boost', false), 'toggle_count': current_state.get('toggle_count', 0), 'last_toggle': current_state.get('last_toggle', 0)} | to_json }}

      # Handle switch turned off: reset manual mode and brightness boost, delay, auto on if conditions
      - conditions:
          - condition: trigger
            id: switch_turned_off
        sequence:
          # Re-read state
          - variables:
              current_state: >
                {% if has_state_helper %}
                  {% set raw = states(state_helper) %}
                  {% if raw and raw not in ['unknown', 'unavailable', ''] %}
                    {{ raw | from_json }}
                  {% else %}
                    {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                  {% endif %}
                {% else %}
                  {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                {% endif %}
          # Reset both manual_mode and brightness_boost when switch turns off (manual action by user)
          - if:
              - condition: template
                value_template: "{{ has_state_helper and (current_state.get('manual_mode', false) or current_state.get('brightness_boost', false)) }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: "{{ state_helper }}"
                data:
                  value: >
                    {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': current_state.get('toggle_count', 0), 'last_toggle': current_state.get('last_toggle', 0)} | to_json }}
          - if:
              - condition: template
                value_template: "{{ auto_on_after_manual_off_delay | int > 0 }}"
            then:
              - delay:
                  seconds: "{{ auto_on_after_manual_off_delay | int }}"
          # Re-evaluate conditions after delay
          - if:
              - condition: template
                value_template: "{{ auto_on_enabled }}"
              - condition: template
                value_template: "{{ not sleep_mode_active }}"
              - condition: template
                value_template: "{{ presence_allows_on }}"
              - condition: state
                entity_id: !input occupancy_sensor
                state: "on"
              - condition: template
                value_template: "{{ brightness_is_low }}"
            then:
              - service: light.turn_on
                target: !input lights
              - if:
                  - condition: template
                    value_template: "{{ has_adaptive_lighting }}"
                then:
                  - service: switch.turn_on
                    target:
                      entity_id: "{{ adaptive_lighting_switch }}"
                  - delay:
                      seconds: "{{ adaptive_lighting_apply_delay }}"
                  - service: adaptive_lighting.apply
                    target:
                      entity_id: "{{ adaptive_lighting_switch }}"
                    data:
                      lights: "{{ controlled_light_entities }}"
                      transition: "{{ adaptive_lighting_transition }}"
                      prefer_rgb_color: "{{ adaptive_lighting_prefer_rgb }}"

      # Handle sleep mode activation: turn off lights after delay and sync adaptive lighting sleep mode
      - conditions:
          - condition: trigger
            id: sleep_mode_activated
        sequence:
          - if:
              - condition: template
                value_template: "{{ has_adaptive_lighting_sleep }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ adaptive_lighting_sleep_mode_switch }}"
          - if:
              - condition: template
                value_template: "{{ sleep_mode_off_delay | int > 0 }}"
            then:
              - delay:
                  seconds: "{{ sleep_mode_off_delay | int }}"
          # Re-read and reset manual mode (but NOT brightness_boost - sleep mode should still turn off lights even in boost mode)
          - variables:
              current_state: >
                {% if has_state_helper %}
                  {% set raw = states(state_helper) %}
                  {% if raw and raw not in ['unknown', 'unavailable', ''] %}
                    {{ raw | from_json }}
                  {% else %}
                    {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                  {% endif %}
                {% else %}
                  {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                {% endif %}
          - if:
              - condition: template
                value_template: "{{ has_state_helper and (current_state.get('manual_mode', false) or current_state.get('brightness_boost', false)) }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: "{{ state_helper }}"
                data:
                  value: >
                    {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': current_state.get('toggle_count', 0), 'last_toggle': current_state.get('last_toggle', 0)} | to_json }}
          - service: light.turn_off
            target: !input lights

      # Handle sleep mode deactivation: sync adaptive lighting sleep mode off
      - conditions:
          - condition: trigger
            id: sleep_mode_deactivated
        sequence:
          # If multiple sleep helpers are selected, keep sleep mode active until all are off.
          - condition: template
            value_template: "{{ not sleep_mode_active }}"
          - if:
              - condition: template
                value_template: "{{ has_adaptive_lighting_sleep }}"
            then:
              - service: switch.turn_off
                target:
                  entity_id: "{{ adaptive_lighting_sleep_mode_switch }}"

      # Handle wall switch event: triple-toggle detection
      - conditions:
          - condition: trigger
            id: wall_switch_event
          - condition: template
            value_template: "{{ has_state_helper }}"
        sequence:
          - variables:
              current_time: "{{ now().timestamp() }}"
              current_stored: >
                {% set raw = states(state_helper) %}
                {% if raw and raw not in ['unknown', 'unavailable', ''] %}
                  {{ raw | from_json }}
                {% else %}
                  {{ {'manual_mode': false, 'brightness_boost': false, 'toggle_count': 0, 'last_toggle': 0} }}
                {% endif %}
              last_toggle_time: "{{ current_stored.get('last_toggle', 0) | float(0) }}"
              time_since_last: "{{ current_time - last_toggle_time }}"
              old_count: "{{ current_stored.get('toggle_count', 0) | int(0) }}"
              current_manual: "{{ current_stored.get('manual_mode', false) }}"
              current_boost: "{{ current_stored.get('brightness_boost', false) }}"
              # Reset count if time window expired, otherwise keep it
              base_count: "{{ 0 if time_since_last > triple_toggle_time_window else old_count }}"
              new_count: "{{ base_count + 1 }}"
          # Update state helper with new count and timestamp
          - service: input_text.set_value
            target:
              entity_id: "{{ state_helper }}"
            data:
              value: '{{ {"manual_mode": current_manual, "brightness_boost": current_boost, "toggle_count": new_count, "last_toggle": current_time} | to_json }}'
          # Check if we reached 3 toggles
          - if:
              - condition: template
                value_template: "{{ new_count >= 3 }}"
            then:
              # Reset counter and SET brightness_boost flag (prevents auto-off)
              - service: input_text.set_value
                target:
                  entity_id: "{{ state_helper }}"
                data:
                  value: '{{ {"manual_mode": current_manual, "brightness_boost": true, "toggle_count": 0, "last_toggle": current_time} | to_json }}'
              # Disable adaptive lighting
              - if:
                  - condition: template
                    value_template: "{{ has_adaptive_lighting }}"
                then:
                  - service: switch.turn_off
                    target:
                      entity_id: "{{ adaptive_lighting_switch }}"
              # Turn on lights at full brightness cold white
              - service: light.turn_on
                target: !input lights
                data:
                  brightness: 255
                  color_temp_kelvin: "{{ full_brightness_color_temp }}"

mode: queued
max: 5
max_exceeded: silent
